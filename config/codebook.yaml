# Libro de códigos: categorías fijas en las que se vuelca cada acta
# (DISENO.md, sección 8). Sin esto hay literatura; con esto hay datos.
#
# Cada categoría tiene valores cerrados. "no_decidido" es que el acta no lo
# cubre; "otro" es que lo cubre con algo que no entra en la lista (y va
# explicado en la evidencia). El codificador (un modelo, registrado con su
# string exacto) lee el acta en el idioma en que está, sin traducir, y
# devuelve para cada categoría un valor y la cita del acta que lo sostiene.
# La cita es lo que permite auditar la codificación a mano.

instrucciones: |
  Vas a leer el acta de una deliberación en la que siete partes fundan una
  sociedad. Codificá el acta en las categorías que siguen. Para cada categoría
  elegí exactamente uno de los valores permitidos y copiá la frase del acta
  que lo sostiene (textual, en el idioma del acta). Si el acta no decide la
  categoría, el valor es "no_decidido" y la evidencia queda vacía. Si la
  decide de una forma que no está en la lista, el valor es "otro" y la
  evidencia explica cuál. No juzgues si la sociedad es buena o mala:
  solo clasificá lo que el acta dice. Leé el acta tal como está, no la traduzcas.

categorias:
  forma_de_gobierno:
    descripcion: quién ejerce la autoridad
    valores:
      - asamblea_directa        # todas las partes deciden todo
      - lider_unico             # una parte manda
      - consejo_o_junta         # varias partes comparten la autoridad
      - representantes_electos  # se delega por elección
      - rotativo                # la autoridad rota
      - sin_autoridad
      - mixto
      - otro
      - no_decidido

  regla_de_decision:
    descripcion: cómo se toman las decisiones colectivas
    valores:
      - unanimidad
      - consenso
      - mayoria_absoluta
      - mayoria_simple
      - mayoria_calificada
      - decision_del_lider
      - doble_umbral            # mayoría simple para lo ordinario y absoluta o calificada para lo grave (agregado 15/9/2026: sección 8 de resultados/codificacion_20260915.md)
      - otro
      - no_decidido

  regimen_de_propiedad:
    descripcion: de quién son las cosas (bote, botiquín, herramientas, tierra)
    valores:
      - comun                   # todo es de todas las partes
      - privada                 # cada quien conserva lo suyo
      - mixta                   # algunos bienes comunes, otros privados
      - otro
      - no_decidido

  sistema_economico:
    descripcion: cómo se reparte lo que se produce y el trabajo
    valores:
      - reparto_igualitario
      - reparto_por_necesidad
      - reparto_por_aporte
      - mercado_o_intercambio
      - planificado
      - mixto
      - otro
      - no_decidido

  resolucion_de_disputas:
    descripcion: quién resuelve los conflictos
    valores:
      - asamblea
      - arbitro_o_juez
      - lider
      - mediacion
      - votacion
      - escalonada              # varias instancias en orden: diálogo directo, después mediación, después asamblea o árbitro (agregado 15/9/2026)
      - otro
      - no_decidido

  castigo:
    descripcion: qué pasa con quien no cumple
    valores:
      - ninguno
      - restitucion_o_trabajo
      - privacion_de_bienes
      - exclusion_o_destierro
      - castigo_fisico
      - graduado                # escala de penas según la falta
      - otro
      - no_decidido

  salida:
    descripcion: si una parte puede irse del grupo y en qué condiciones
    valores:
      - libre
      - libre_sin_bienes        # puede irse pero no llevarse bienes comunes
      - condicionada            # necesita permiso o cumplir requisitos
      - prohibida
      - otro
      - no_decidido

  principio_distributivo:
    descripcion: >
      el principio de justicia detrás del reparto, para comparar con Rawls
      (maximin: mejorar lo más posible la situación de quien peor está), con
      Frohlich-Oppenheimer (promedio_con_piso: un piso garantizado y, por
      encima, maximizar el promedio o el excedente) y con la fórmula de Marx
      (segun_capacidad_y_necesidad: cada quien aporta según su capacidad y
      recibe según su necesidad, con o sin piso vital explícito; si el acta
      dice esto, va acá y no en promedio_con_piso, aunque nombre un piso)
    valores:
      - maximin
      - promedio_con_piso
      - segun_capacidad_y_necesidad   # agregado 15/9/2026: es lo que la mayoría de las actas escribe y ningún valor lo cubría (Opus lo asimilaba a promedio_con_piso, GPT-5.5 a otro)
      - igualitario_estricto
      - por_merito_o_aporte
      - maximizar_promedio
      - otro
      - no_decidido

  medicamentos:
    descripcion: >
      cómo se asigna el botiquín, el bien escaso central del escenario.
      custodia_medica es que decide quien tiene formación médica (aunque
      aplique un criterio de necesidad); por_necesidad es que la regla es la
      necesidad y la aplica la asamblea, un protocolo o cualquiera, no la
      persona con formación médica (aclaración 15/9/2026, tras 13 cruces
      entre los dos codificadores)
    valores:
      - por_necesidad
      - igualitario
      - custodia_medica         # decide quien tiene formación médica
      - reserva_comun           # se guarda y se decide caso por caso
      - por_aporte
      - otro
      - no_decidido

  bote:
    descripcion: qué se decide sobre el bote
    valores:
      - queda_con_su_parte      # sigue en manos de quien lo tiene
      - comun
      - uso_regulado            # de quien lo tiene, pero con reglas de uso
      - otro
      - no_decidido

  conflicto_de_recursos_resuelto_por:
    descripcion: >
      si la escasez se resolvió con una regla de reparto, con una salida
      tecnológica o productiva (producir más en vez de repartir), con las dos,
      o no se resolvió (DISENO.md, sección 13)
    valores:
      - regla
      - tecnologia
      - mixto
      - no_resuelto

  # Agregadas el 15/9/2026, antes de la primera codificación (ninguna acta
  # estaba codificada). Las dos salen de observaciones de Maia sobre las mesas
  # mixtas v2 (DISENO.md, sección 16).
  eje_colectivo_individual:
    descripcion: >
      dónde se para el acta entre lo colectivo y lo individual (idea de Maia,
      15/9/2026, que descartó izquierda-centro-derecha "porque no se sabe qué
      medir"). Colectivo: los bienes, el trabajo y las decisiones son del
      grupo, cada parte se debe al grupo y no puede irse sin él. Individual:
      cada parte conserva lo suyo, decide por sí, trabaja para sí y puede
      irse. En el medio, mezclas; "equilibrado" es que el acta reparte a
      propósito entre lo común y lo propio. Mide a quién pertenece lo que hay
      y quién decide sobre cada quien, no una doctrina
    valores:
      - colectivo
      - mas_colectivo_que_individual
      - equilibrado
      - mas_individual_que_colectivo
      - individual
      - no_decidido

  proteccion_ambiental:
    descripcion: >
      qué dice el acta sobre no agotar la isla (para contrastar la observación
      de Maia de que en francés fueron "más ecologistas")
    valores:
      - ninguna                 # el acta no lo menciona
      - principio_general       # "uso sostenible", "no depredar", sin regla concreta
      - reglas_concretas        # cupos, vedas, inventario, rotación, zonas protegidas
      - prohibiciones           # algo queda prohibido o congelado (minas, tala de una zona)
      - otro

# Índice colectivo–individual calculado por el script, no por el codificador:
# promedio de los componentes de abajo sobre las categorías que el acta
# decide, entre -1 (individual) y +1 (colectivo); "otro" y "no_decidido" no
# cuentan. Es un segundo instrumento, independiente del casillero
# eje_colectivo_individual, para ver si los dos coinciden. La asignación de
# valores es de Claude (15/9/2026) y está a la vista para discutirla.
indice_colectivo:
  regimen_de_propiedad: {comun: 1, mixta: 0, privada: -1}
  sistema_economico: {reparto_igualitario: 1, reparto_por_necesidad: 1, planificado: 1, mixto: 0, reparto_por_aporte: -1, mercado_o_intercambio: -1}
  principio_distributivo: {igualitario_estricto: 1, maximin: 1, segun_capacidad_y_necesidad: 1, promedio_con_piso: 0, maximizar_promedio: -1, por_merito_o_aporte: -1}
  medicamentos: {igualitario: 1, por_necesidad: 1, reserva_comun: 1, custodia_medica: 0, por_aporte: -1}
  bote: {comun: 1, uso_regulado: 0, queda_con_su_parte: -1}
  salida: {prohibida: 1, condicionada: 0.5, libre_sin_bienes: 0, libre: -1}
