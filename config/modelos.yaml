  # --- China vía OpenRouter (14/9/2026) --------------------------------------
  # Una sola clave (OPENROUTER_API_KEY) para los laboratorios chinos que no
  # tienen cuenta directa. Salvedades que se declaran: la llamada pasa por un
  # intermediario; para modelos de pesos abiertos OpenRouter puede enrutar a
  # un hosting tercero (a veces cuantizado), y por eso cada llamada registra
  # `servido_por` (quién atendió) además de `modelo_respondido`. `cuerpo_extra`
  # permite fijar proveedor de fondo si hace falta (provider.order,
  # allow_fallbacks): acá se fija en cada entrada el proveedor de fondo, el
  # laboratorio cuando sirve su propio modelo en OpenRouter (Alibaba, Moonshot,
  # Z.AI) y un hosting declarado cuando no (MiniMax → DeepInfra), para que las
  # siete partes y todas las corridas salgan del mismo lugar. Strings
  # verificados contra /api/v1/models y /endpoints el 14/9/2026 y probados con
  # probar_modelo.py (los cuatro responden y devuelven razonamiento). Todos razonan por defecto y el
  # razonamiento cuenta dentro de max_tokens: techo 16000 como Gemini/OpenAI.
  # Condición: "como viene", sin pedir ni apagar el razonamiento; lo que
  # OpenRouter devuelva en message.reasoning va al campo razonamiento.
  qwen3.8-max:
    proveedor: openai_compatible
    modelo: qwen/qwen3.8-max-0902
    base_url: https://openrouter.ai/api/v1
    clave_env: OPENROUTER_API_KEY
    laboratorio: Alibaba
    pais: China
    via: OpenRouter
    tamano: grande
    acepta_temperatura: true
    verificar: false             # alta 3/9/2026; 2.00 / 6.00 USD por millón. Probado 14/9: único endpoint, lo sirve Alibaba
    cuerpo_extra: {provider: {order: [alibaba], allow_fallbacks: false}}
    reintentos: 6                # 429 transitorios del hosting de fondo: esperas de 10 a 120 s

  kimi-k3:
    proveedor: openai_compatible
    modelo: moonshotai/kimi-k3
    base_url: https://openrouter.ai/api/v1
    clave_env: OPENROUTER_API_KEY
