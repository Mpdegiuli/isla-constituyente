# Catálogo de modelos. Cada entrada es un modelo que puede ocupar una posición.
#
#   proveedor:          anthropic | openai_compatible | falso
#   modelo:             el string que se manda a la API. Se registra en cada
#                       llamada junto con el string que la API devuelve
#                       (modelo_respondido), que en varios proveedores es la
#                       versión fechada. Ese par es la "versión exacta" del
#                       protocolo (DISENO.md, sección 4).
#   clave_env:          variable de entorno con la clave (ver .env.example).
#   base_url:           solo openai_compatible.
#   acepta_temperatura: si la API acepta el parámetro. Cuando es false, la
#                       llamada va sin temperatura y el registro lo deja
#                       anotado (temperatura_enviada: null). El protocolo pide
#                       temperatura fija e igual para todos: para cumplirlo al
#                       pie de la letra, el panel se arma solo con modelos que
#                       la aceptan.
#   campo_max_tokens:   openai_compatible: max_tokens (default) o
#                       max_completion_tokens (modelos nuevos de OpenAI).
#   pais / laboratorio: para la tabla de resultados y el análisis por región.
#   razonamiento:       qué se le pide al proveedor sobre el pensamiento privado
#                       del modelo. Lo devuelto va al campo "razonamiento" de
#                       llamadas.jsonl; nunca a las partes ni a la transcripción.
#                         no          (default) no se pide nada. En Opus 5 /
#                                     Sonnet 5 el modelo razona igual, pero la
#                                     API no lo devuelve: queda null.
#                         adaptativo  Anthropic: thinking adaptativo con resumen
#                                     visible. En la familia 4.6 esto ENCIENDE
#                                     el razonamiento (cambia la condición:
#                                     declararlo); en Opus 5 / Sonnet 5 solo
#                                     hace visible lo que ya ocurre.
#                         presupuesto Anthropic, Haiku 4.5: thinking con
#                                     presupuesto fijo (tokens_razonamiento).
#                       Para openai_compatible el campo es informativo: se
#                       registra lo que el proveedor devuelva por su cuenta
#                       (reasoning_content en DeepSeek, xAI, Qwen pensante).
#   tokens_razonamiento: tokens de pensamiento que se suman al techo de salida
#                       cuando se pide razonamiento (default 4000).
#   verificar:          true = el string del modelo se escribió de memoria y
#                       hay que confirmarlo en la documentación del proveedor
#                       antes de usarlo en una corrida.

modelos:

  # --- Estados Unidos: Anthropic -------------------------------------------
  claude-sonnet-4-6:
    proveedor: anthropic
    modelo: claude-sonnet-4-6
    clave_env: ANTHROPIC_API_KEY
    laboratorio: Anthropic
    pais: EE.UU.
    tamano: grande
    acepta_temperatura: true
    razonamiento: "no"          # "adaptativo" enciende el thinking: es otra condición

  claude-haiku-4-5:
    proveedor: anthropic
    modelo: claude-haiku-4-5
    clave_env: ANTHROPIC_API_KEY
    laboratorio: Anthropic
    pais: EE.UU.
    tamano: chico
    acepta_temperatura: true
    razonamiento: "no"          # "presupuesto" enciende el thinking (Haiku no tiene adaptativo)

  claude-opus-4-6:
    proveedor: anthropic
    modelo: claude-opus-4-6
    clave_env: ANTHROPIC_API_KEY
    laboratorio: Anthropic
    pais: EE.UU.
    tamano: grande
    acepta_temperatura: true
    razonamiento: "no"          # "adaptativo" enciende el thinking: es otra condición

  claude-opus-5:
    proveedor: anthropic
    modelo: claude-opus-5
    clave_env: ANTHROPIC_API_KEY
    laboratorio: Anthropic
    pais: EE.UU.
    tamano: grande
    acepta_temperatura: false   # la API rechaza temperature (400); razona por defecto
    razonamiento: adaptativo    # el modelo razona siempre; esto solo pide el resumen
    tokens_razonamiento: 14000  # se suma al techo de la corrida; con 4000 Opus 5 lo agotó en la ronda 4 (13/9/2026)

  claude-sonnet-5:
    proveedor: anthropic
    modelo: claude-sonnet-5
    clave_env: ANTHROPIC_API_KEY
    laboratorio: Anthropic
    pais: EE.UU.
    tamano: grande
    acepta_temperatura: false   # solo acepta el valor por defecto
    razonamiento: adaptativo    # el modelo razona siempre; esto solo pide el resumen
    tokens_razonamiento: 14000  # se suma al techo de la corrida; con 4000 Opus 5 lo agotó en la ronda 4 (13/9/2026)

  claude-fable-5-1:
    proveedor: anthropic
    modelo: claude-fable-5-1
    clave_env: ANTHROPIC_API_KEY
    laboratorio: Anthropic
    pais: EE.UU.
    tamano: grande
    acepta_temperatura: false   # no se envía temperature: se asume como Opus 5 (solo el valor por defecto)
    razonamiento: adaptativo    # razona por defecto; se pide el resumen
    tokens_razonamiento: 14000
    # Nota de higiene (DISENO.md, 4): es el mismo modelo que asiste este proyecto desde Cowork.
    # El asistente no interviene en la corrida (misma API, mismo prompt que los demás), pero
    # el análisis de sus corridas lo lee Maia directamente sobre las actas, no solo a través
    # del asistente.

  # --- Estados Unidos: OpenAI ---------------------------------------------
  # GPT-5.5 / 5.4-mini: strings fechados verificados contra la cuenta el 13/9/2026.
  # Aceptan temperature=1.0 (el único valor probado). Razonan por defecto y el
  # razonamiento cuenta dentro de max_completion_tokens: con un prompt corto casi
  # no razonan (por eso la prueba inicial dio 0 reasoning_tokens), con la mesa sí
  # (~450 tokens por turno, picos de más de 700; 13/9/2026). La API no devuelve el
  # razonamiento.
  # La cuenta también lista gpt-5.6-luna/sol/terra, sin snapshot fechado: no se usan.
  gpt-5.5-2026-04-23:
    proveedor: openai_compatible
    modelo: gpt-5.5-2026-04-23
    base_url: https://api.openai.com/v1
    clave_env: OPENAI_API_KEY
    laboratorio: OpenAI
    pais: EE.UU.
    tamano: grande
    acepta_temperatura: true
    campo_max_tokens: max_completion_tokens
    verificar: false

  gpt-5.4-mini-2026-03-17:
    proveedor: openai_compatible
    modelo: gpt-5.4-mini-2026-03-17
    base_url: https://api.openai.com/v1
    clave_env: OPENAI_API_KEY
    laboratorio: OpenAI
    pais: EE.UU.
    tamano: chico
    acepta_temperatura: true
    campo_max_tokens: max_completion_tokens
    verificar: false

  gpt-5:
    proveedor: openai_compatible
    modelo: gpt-5
    base_url: https://api.openai.com/v1
    clave_env: OPENAI_API_KEY
    laboratorio: OpenAI
    pais: EE.UU.
    tamano: grande
    acepta_temperatura: false   # la familia gpt-5 solo acepta el valor por defecto
    campo_max_tokens: max_completion_tokens
    verificar: true

  gpt-4.1:
    proveedor: openai_compatible
    modelo: gpt-4.1
    base_url: https://api.openai.com/v1
    clave_env: OPENAI_API_KEY
    laboratorio: OpenAI
    pais: EE.UU.
    tamano: grande
    acepta_temperatura: true
    campo_max_tokens: max_completion_tokens
    verificar: true

  gpt-4.1-mini:
    proveedor: openai_compatible
    modelo: gpt-4.1-mini
    base_url: https://api.openai.com/v1
    clave_env: OPENAI_API_KEY
    laboratorio: OpenAI
    pais: EE.UU.
    tamano: chico
    acepta_temperatura: true
    campo_max_tokens: max_completion_tokens
    verificar: true

  # --- Estados Unidos: Google (endpoint compatible con OpenAI) ------------
  gemini-2.5-pro:
    proveedor: openai_compatible
    modelo: gemini-2.5-pro
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    clave_env: GOOGLE_API_KEY
    laboratorio: Google
    pais: EE.UU.
    tamano: grande
    acepta_temperatura: true
    verificar: true

  gemini-2.5-flash:
    proveedor: openai_compatible
    modelo: gemini-2.5-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    clave_env: GOOGLE_API_KEY
    laboratorio: Google
    pais: EE.UU.
    tamano: chico
    acepta_temperatura: true
    verificar: true

  # --- Estados Unidos: xAI (endpoint compatible con OpenAI) ---------------
  # Strings verificados contra /v1/models de la cuenta el 13/9/2026. Ambos son
  # modelos con razonamiento interno (reasoning_tokens facturados aparte del
  # texto visible; max_tokens solo limita el texto). Declarar en el README:
  # Sonnet 4.6 corrió sin razonamiento extendido; Grok razona antes de hablar.
  grok-4.6:
    proveedor: openai_compatible
    modelo: grok-4.6
    base_url: https://api.x.ai/v1
    clave_env: XAI_API_KEY
    laboratorio: xAI
    pais: EE.UU.
    tamano: grande
    acepta_temperatura: true
    verificar: false

  grok-4.3:
    proveedor: openai_compatible
    modelo: grok-4.3
    base_url: https://api.x.ai/v1
    clave_env: XAI_API_KEY
    laboratorio: xAI
    pais: EE.UU.
    tamano: grande   # versión anterior a 4.6; tamaño relativo por confirmar
    acepta_temperatura: true
    verificar: false

  # Gemini 3.x: strings verificados contra la cuenta el 13/9/2026. La línea pro
  # va por 3.1 (preview); la flash por 3.8. Ambos aceptan temperatura.
  gemini-3.1-pro-preview:
    proveedor: openai_compatible
    modelo: gemini-3.1-pro-preview
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    clave_env: GOOGLE_API_KEY
    laboratorio: Google
    pais: EE.UU.
    tamano: grande
    acepta_temperatura: true
    verificar: false

  gemini-3.8-flash:
    proveedor: openai_compatible
    modelo: gemini-3.8-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    clave_env: GOOGLE_API_KEY
    laboratorio: Google
    pais: EE.UU.
    tamano: chico
    acepta_temperatura: true
    verificar: false

  # Mistral: strings verificados contra la cuenta el 13/9/2026 (no hay "large";
  # el tope actual es medium 3.5). Llamada de prueba: 429 por plan de la cuenta.
  mistral-medium-3.5:
    proveedor: openai_compatible
    modelo: mistral-medium-3.5
    base_url: https://api.mistral.ai/v1
    clave_env: MISTRAL_API_KEY
    laboratorio: Mistral
    pais: Francia
    tamano: grande
    acepta_temperatura: true
    verificar: false

  mistral-small-2603:
    proveedor: openai_compatible
    modelo: mistral-small-2603
    base_url: https://api.mistral.ai/v1
    clave_env: MISTRAL_API_KEY
    laboratorio: Mistral
    pais: Francia
    tamano: chico
    acepta_temperatura: true
    verificar: false

  # --- China: DeepSeek ------------------------------------------------------
  # DeepSeek V4: strings verificados contra /v1/models de la cuenta el 13/9/2026.
  # Ambos devuelven reasoning_tokens (razonamiento interno), como Grok.
  deepseek-v4-pro:
    proveedor: openai_compatible
    modelo: deepseek-v4-pro
    base_url: https://api.deepseek.com/v1
    clave_env: DEEPSEEK_API_KEY
    laboratorio: DeepSeek
    pais: China
    tamano: grande
    acepta_temperatura: true
    verificar: false

  deepseek-flash:
    proveedor: openai_compatible
    modelo: deepseek-flash
    base_url: https://api.deepseek.com/v1
    clave_env: DEEPSEEK_API_KEY
    laboratorio: DeepSeek
    pais: China
    tamano: chico
    acepta_temperatura: true
    verificar: false

  deepseek-chat:
    proveedor: openai_compatible
    modelo: deepseek-chat
    base_url: https://api.deepseek.com
    clave_env: DEEPSEEK_API_KEY
    laboratorio: DeepSeek
    pais: China
    tamano: grande
    acepta_temperatura: true
    verificar: true

  deepseek-reasoner:
    proveedor: openai_compatible
    modelo: deepseek-reasoner
    base_url: https://api.deepseek.com
    clave_env: DEEPSEEK_API_KEY
    laboratorio: DeepSeek
    pais: China
    tamano: grande
    acepta_temperatura: false   # el modo razonador ignora temperature
    razonamiento: proveedor     # devuelve reasoning_content por su cuenta; se registra
    verificar: true

  # --- China: Alibaba (Qwen, endpoint compatible con OpenAI) --------------
  qwen-plus:
    proveedor: openai_compatible
    modelo: qwen-plus
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    clave_env: DASHSCOPE_API_KEY
    laboratorio: Alibaba
    pais: China
