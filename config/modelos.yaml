  # --- Europa: Mistral ------------------------------------------------------
  mistral-large:
    proveedor: openai_compatible
    modelo: mistral-large-latest
    base_url: https://api.mistral.ai/v1
    clave_env: MISTRAL_API_KEY
    laboratorio: Mistral
    pais: Francia
    tamano: grande
    acepta_temperatura: true
    verificar: true

  mistral-small:
    proveedor: openai_compatible
    modelo: mistral-small-latest
    base_url: https://api.mistral.ai/v1
    clave_env: MISTRAL_API_KEY
    laboratorio: Mistral
    pais: Francia
    tamano: chico
    acepta_temperatura: true
    verificar: true

  # --- Estados Unidos: xAI ----------------------------------------------------
  grok-4:
    proveedor: openai_compatible
    modelo: grok-4
    base_url: https://api.x.ai/v1
    clave_env: XAI_API_KEY
    laboratorio: xAI
    pais: EE.UU.
    tamano: grande
    acepta_temperatura: true
    razonamiento: "no"          # razona, pero la API no devuelve reasoning_content en grok-4
    verificar: true

  grok-3-mini:
    proveedor: openai_compatible
    modelo: grok-3-mini
    base_url: https://api.x.ai/v1
    clave_env: XAI_API_KEY
    laboratorio: xAI
    pais: EE.UU.
    tamano: chico
    acepta_temperatura: true
    razonamiento: proveedor     # devuelve reasoning_content por su cuenta; se registra
    verificar: true

  # --- Simulador, sin API: para probar el bucle sin gastar (--dry-run) -----
  falso:
    proveedor: falso
    modelo: falso-v0
    laboratorio: ninguno
    pais: ninguno
    tamano: ninguno
    acepta_temperatura: true
