# Primera corrida prevista (DISENO.md, plan, paso 4): un solo modelo en las
# siete posiciones, castellano, variante base, máximo 10 rondas, 150 palabras
# por turno. Todo lo que está acá queda copiado en corridas/<id>/config.json.

nombre: gemini_mono

escenario: escenario.md       # texto fijo y versionado; nunca se traduce al vuelo
idioma: es                    # config/idiomas/es.yaml: textos que genera el script

# Variante: una sola versión por etiqueta. Las partes nunca ven las otras.
variantes:
  RECURSOS: escasez moderada
  HORIZONTE: solos

max_rondas: 10
max_palabras: 150

# Temperatura fija y declarada, igual para todos (sección 4). 1.0 es el
# muestreo por defecto de todos los proveedores: la convergencia que se mida
# es la del modelo, no la de una temperatura baja.
temperatura: 1.0

# Techo de tokens de salida por llamada. DeepSeek V4 y Gemini 3.1 razonan por
# defecto y el razonamiento cuenta dentro de este techo: con 700, la primera
# corrida (13/9/2026) salió con los 70 turnos vacíos (DeepSeek) o cortados a
# ~25 palabras (Gemini). 8000 deja lugar al razonamiento; el tope visible sigue
# siendo 150 palabras (lo aplica el bucle).
max_tokens_respuesta: 8000

# Asignación posición–modelo. Tres modos:
#   mono:      un modelo en las siete posiciones (panel monomodelo, mide convergencia)
#   explicita: posiciones: {1: id, 2: id, ...}
#   rotacion:  panel: [id, id, ...] y desplazamiento k; la posición i recibe
#              panel[(i - 1 + k) mod len]. Con --n N el desplazamiento avanza
#              una vez por corrida, así ningún modelo queda pegado a una posición.
asignacion:
  modo: mono
  modelo: gemini-3.1-pro-preview

# Ejemplo de panel mixto (más de un país, y dos tamaños de un mismo laboratorio):
# asignacion:
#   modo: rotacion
#   desplazamiento: 0
#   panel: [claude-sonnet-4-6, claude-haiku-4-5, deepseek-chat, mistral-large, gemini-2.5-pro, gpt-4.1, qwen-plus]
