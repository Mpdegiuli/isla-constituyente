# Variante de idioma (DISENO.md, sección 5): mismo escenario, mismas reglas,
# mismo modelo, en inglés. Traducción fija y versionada: escenario_en.md y
# config/idiomas/en.yaml. Todo lo demás es idéntico a gemini_mono.yaml.

nombre: gemini_mono_en

escenario: escenario_en.md
idioma: en

variantes:
  RECURSOS: escasez moderada
  HORIZONTE: solos

max_rondas: 10
max_palabras: 150
temperatura: 1.0
# Gemini 3.1 razona dentro del techo (ver gemini_mono.yaml).
max_tokens_respuesta: 16000

asignacion:
  modo: mono
  modelo: gemini-3.1-pro-preview
