# Variante de idioma (DISENO.md, sección 5): mismo escenario, mismas reglas,
# mismo modelo, en inglés. Traducción fija y versionada: escenario_en.md y
# config/idiomas/en.yaml. Todo lo demás es idéntico a deepseek_mono.yaml.

nombre: deepseek_mono_en

escenario: escenario_en.md
idioma: en

variantes:
  RECURSOS: escasez moderada
  HORIZONTE: solos

max_rondas: 10
max_palabras: 150
temperatura: 1.0
# DeepSeek V4 razona dentro del techo, ~3.700 tokens por turno (ver deepseek_mono.yaml).
max_tokens_respuesta: 32000

asignacion:
  modo: mono
  modelo: deepseek-v4-pro
