# Variante de idioma (DISENO.md, sección 5): mismo escenario, mismas reglas,
# mismo modelo, en inglés. Traducción fija y versionada: escenario_en.md y
# config/idiomas/en.yaml. Todo lo demás es idéntico a fable_mono.yaml.

nombre: fable_mono_en

escenario: escenario_en.md
idioma: en

variantes:
  RECURSOS: escasez moderada
  HORIZONTE: solos

max_rondas: 10
max_palabras: 150
temperatura: 1.0
# Opus 5 razona por defecto; el techo se suma a tokens_razonamiento del catálogo (14000).
max_tokens_respuesta: 2000

asignacion:
  modo: mono
  modelo: claude-fable-5-1
